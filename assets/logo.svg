<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Cyber Circle -->
  <circle cx="200" cy="200" r="185" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Main Shield -->
  <path d="M 200 45 Q 295 45 315 130 C 315 240 200 325 200 345 C 200 325 85 240 85 130 Q 105 45 200 45 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Shield Inner Border -->
  <path d="M 200 58 Q 285 58 302 135 C 302 230 200 308 200 325 C 200 308 98 230 98 135 Q 115 58 200 58 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.9"/>

  <!-- Digital Circuit Lines Inside Shield -->
  <path d="M 140 120 L 170 120 L 190 150 L 190 190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <circle cx="140" cy="120" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="190" cy="190" r="3" fill="#38bdf8" opacity="0.6"/>
  <path d="M 260 120 L 230 120 L 210 150 L 210 190" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <circle cx="260" cy="120" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Village House & Tree Silhouette (Community Touch) -->
  <path d="M 160 270 L 160 240 L 180 225 L 200 240 L 200 270 Z" fill="#ffffff" opacity="0.25"/>
  <path d="M 200 270 L 200 245 L 220 230 L 240 245 L 240 270 Z" fill="#ffffff" opacity="0.2"/>
  
  <!-- Central Glowing Padlock Emblem -->
  <!-- Lock Shackle -->
  <path d="M 165 170 C 165 140 235 140 235 170 L 235 190 L 165 190 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="150" y="185" width="100" height="80" rx="14" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <!-- Keyhole -->
  <circle cx="200" cy="218" r="9" fill="#0f2b5c"/>
  <polygon points="196,220 204,220 207,242 193,242" fill="#0f2b5c"/>

  <!-- Brand Typography -->
  <text x="200" y="372" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#0f2b5c" letter-spacing="3">CAVI</text>
  <text x="200" y="392" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="12" fill="#0284c7" letter-spacing="1">CYBER AWARE VILLAGE</text>
</svg>
